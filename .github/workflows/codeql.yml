name: 'CodeQL Advanced'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'java-kotlin', 'python', 'actions']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6

      - name: Setup PNPM
        if: matrix.language == 'java-kotlin'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Monorepo Dependencies & Sync Capacitor
        if: matrix.language == 'java-kotlin'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @workspace/studio-android android:sync

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          config-file: .github/codeql/codeql-config.yml

      - name: Build Android App for Java/Kotlin Analysis
        if: matrix.language == 'java-kotlin'
        run: |
          cd apps/studio-android/android
          chmod +x gradlew
          ./gradlew clean assembleDebug --rerun-tasks --no-daemon --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
