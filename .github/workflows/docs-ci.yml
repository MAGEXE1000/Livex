name: Documentation CI
run-name: Docs CI - ${{ github.ref_name }}

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-documentation.mjs'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-documentation.mjs'
      - '.github/workflows/docs-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Documentation Link & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Pipeline Queue & Diagnostic Inspection
        run: |
          echo "=== DOCS CI QUEUE DIAGNOSTICS ==="
          echo "Selected Concurrency Group: ci-docs-${{ github.ref }}"
          echo "Runner Requested: ubuntu-latest"
          echo "Workflow Event: ${{ github.event_name }}"
          echo "Target Ref: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Allocation Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "================================="
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Documentation Links & Syntax
        run: pnpm docs:validate
