name: 'Livex CodeQL Security Configuration'
paths:
  - apps
  - packages
  - scripts
paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - 'apps/studio-android/android/app/build/**'
  - 'apps/studio-android/android/.gradle/**'
query-filters:
  - exclude:
      filename:
        - /.*node_modules.*/
        - /.*\/build\/.*/
        - /.*\/dist\/.*/
