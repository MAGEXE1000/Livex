    <script>
      (function() {
        try {
          var theme = null;
          // 1. Fast-read synchronous token
          try {
            theme = localStorage.getItem('livex-persisted-theme') || localStorage.getItem('livex_theme') || localStorage.getItem('studio_theme');
          } catch (_) {}

          // 2. Synchronous fallback decryption for existing sessions before fast token set
          if (!theme) {
            try {
              var raw = localStorage.getItem('settings-storage-v1') || localStorage.getItem('chord-explorer-storage-v3');
              if (raw) {
                var decrypted = raw;
                if (raw.indexOf('v3:') === 0 || raw.indexOf('v2:') === 0) {
                  decrypted = (function decrypt(r) {
                    try {
                      if (r.indexOf('v3:') === 0) {
                        var p = r.split(':');
                        if (p.length >= 5) {
                          var hex = p[4], b = new Uint8Array(hex.length / 2);
                          for (var i = 0; i < hex.length; i += 2) b[i/2] = parseInt(hex.substr(i, 2), 16);
                          return decrypt(new TextDecoder().decode(b));
                        }
                        return null;
                      }
                      if (r.indexOf('v2:') === 0) {
                        var p2 = r.split(':');
                        if (p2.length !== 4) return null;
                        var sh = p2[1], ch = p2[3];
                        var sb = new Uint8Array(sh.length / 2), cb = new Uint8Array(ch.length / 2);
                        for (var i = 0; i < sh.length; i += 2) sb[i/2] = parseInt(sh.substr(i, 2), 16);
                        for (var j = 0; j < ch.length; j += 2) cb[j/2] = parseInt(ch.substr(j, 2), 16);
                        var pb = new Uint8Array(cb.length);
                        for (var k = 0; k < cb.length; k++) pb[k] = cb[k] ^ (sb[k % 8] + k);
                        return new TextDecoder().decode(pb);
                      }
                    } catch (_) {}
                    return r;
                  })(raw);
                }
                if (decrypted) {
                  var parsed = JSON.parse(decrypted);
                  var settings = (parsed && parsed.state && parsed.state.settings) || parsed.settings;
                  if (settings) {
                    var t = settings.theme || 'light';
                    var isSysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
                    var isL = (t === 'light') || (t === 'system' && isSysLight);
                    var isA = !isL && (!!settings.amoledMode || !!(settings.perApp && settings.perApp.hub && settings.perApp.hub.amoledMode));
                    theme = isL ? 'light' : (isA ? 'amoled' : 'dark');
                  }
                }
              }
            } catch (_) {}
          }

          // 3. Clean fallback default
          if (!theme) {
            theme = 'light';
          }

          var isLight = (theme === 'light');
          var isAmoled = (theme === 'amoled');

          var doc = document.documentElement;
          doc.setAttribute('data-theme', theme);
          if (isLight) {
            doc.classList.add('light');
            doc.classList.remove('dark');
            doc.classList.remove('amoled');
            doc.style.setProperty('--intro-bg', '#ffffff');
            doc.style.setProperty('--c-background', '#f4f4f5');

            doc.style.setProperty('--c-surface-lowest', '#e4e4e7');
            doc.style.setProperty('--c-surface-low', '#ececed');
            doc.style.setProperty('--c-surface-mid', '#f4f4f5');
            doc.style.setProperty('--c-surface-high', '#fafafa');
            doc.style.setProperty('--c-surface-highest', '#ffffff');
            doc.style.setProperty('--c-text-primary', '#18181b');
            doc.style.setProperty('--c-text-secondary', '#52525b');
            doc.style.setProperty('--c-text-muted', '#71717a');
            doc.style.setProperty('--c-border', 'rgba(0, 0, 0, 0.08)');
          } else if (isAmoled) {
            doc.classList.add('dark');
            doc.classList.add('amoled');
            doc.classList.remove('light');
            doc.style.setProperty('--intro-bg', '#000000');
            doc.style.setProperty('--c-background', '#000000');
            doc.style.setProperty('--app-bg', '#000000');
            doc.style.setProperty('--c-surface-lowest', '#000000');
            doc.style.setProperty('--c-surface-low', '#08080a');
            doc.style.setProperty('--c-surface-mid', '#0f0f13');
            doc.style.setProperty('--c-surface-high', '#17171d');
            doc.style.setProperty('--c-surface-highest', '#202028');
            doc.style.setProperty('--c-text-primary', '#ffffff');
            doc.style.setProperty('--c-text-secondary', '#a1a1aa');
            doc.style.setProperty('--c-text-muted', '#71717a');
            doc.style.setProperty('--c-border', 'rgba(255, 255, 255, 0.12)');
          } else {
            doc.classList.add('dark');
            doc.classList.remove('light');
            doc.classList.remove('amoled');
            doc.style.setProperty('--intro-bg', '#141414');
            doc.style.setProperty('--c-background', '#141414');
            doc.style.setProperty('--app-bg', '#141414');
            doc.style.setProperty('--c-surface-lowest', '#101010');
            doc.style.setProperty('--c-surface-low', '#161616');
            doc.style.setProperty('--c-surface-mid', '#1e1e1e');
            doc.style.setProperty('--c-surface-high', '#262626');
            doc.style.setProperty('--c-surface-highest', '#2e2e2e');
            doc.style.setProperty('--c-text-primary', '#f4f4f6');
            doc.style.setProperty('--c-text-secondary', '#a1a1aa');
            doc.style.setProperty('--c-text-muted', '#71717a');
            doc.style.setProperty('--c-border', 'rgba(255, 255, 255, 0.08)');
          }

          var themeColor = isLight ? '#ffffff' : (isAmoled ? '#000000' : '#141414');
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', themeColor);
          } else {
            var meta = document.createElement('meta');
            meta.name = 'theme-color';
            meta.content = themeColor;
            document.head.appendChild(meta);
          }
        } catch(e) {}
      })();
    </script>
    <script>
      window.__bootTimings = {
        htmlStart: performance.now(),
        firstPaint: -1,
        introStart: -1,
        reactBootstrapStart: -1,

      };
      if (typeof PerformanceObserver !== 'undefined') {
        var observer = new PerformanceObserver(function (list) {
          var entries = list.getEntries();
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].name === 'first-paint') {
              window.__bootTimings.firstPaint = entries[i].startTime;
              console.log(
                '[LivexBoot] first-paint detected at: ' + entries[i].startTime.toFixed(2) + 'ms'
              );
            }
          }
        });
        try {
          observer.observe({ entryTypes: ['paint'] });
        } catch (e) {}
      }
      console.log(
        '[LivexBoot] index.html parsing started at: ' +
          window.__bootTimings.htmlStart.toFixed(2) +
          'ms'
      );
    </script>

    <script>
      (function () {
        try {
          // Check appMode to skip intro on cold boot to a sub-app directly
          var appMode = 'hub';
          try {
            var raw = localStorage.getItem('chord-explorer-storage-v3');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.state && parsed.state.settings) {
                appMode = parsed.state.settings.appMode || 'hub';
              }
            }
          } catch (e) {}

          var path = window.location.pathname;
          var isApp =
            path === '/app' || path.startsWith('/app/') || path === '/' || path === '/index.html';
          var alreadyShown = false;
          try {
            var isLocalDev =
              window.location.hostname === 'localhost' ||
              window.location.hostname === '127.0.0.1' ||
              window.location.port === '5174';
            alreadyShown = isLocalDev || !!sessionStorage.getItem('studio-intro-shown');
          } catch (e) {}

          if (isApp && !alreadyShown && appMode === 'hub') {
            document.documentElement.classList.add('app-route');
            document.documentElement.classList.remove('landing-route');
          } else {
            document.documentElement.classList.add('landing-route');
            document.documentElement.classList.remove('app-route');
            window.__introReturnedEarly = true;
            try {
              if (
                window.Capacitor &&
                window.Capacitor.Plugins &&
                window.Capacitor.Plugins.AppInstaller
              ) {
                window.Capacitor.Plugins.AppInstaller.notifyAppReady();
              }
            } catch (e) {}
          }

        } catch (e) {
          console.warn('Theme prep error:', e);
        }
      })();

    <script>
      // ── Instant Handshake to React LaunchAnimationEngine ────────────────
      (function () {
        var intro = document.getElementById('intro');
        if (window.__introReturnedEarly || !intro) {
          window.__introReturnedEarly = true;
          try {
            if (
              window.Capacitor &&
              window.Capacitor.Plugins &&
              window.Capacitor.Plugins.AppInstaller
            ) {
              window.Capacitor.Plugins.AppInstaller.notifyAppReady();
            }
          } catch (e) {}
          return;
        }

        // Notify Android wrapper immediately that WebView has completed first paint
        try {
          if (
            window.Capacitor &&
            window.Capacitor.Plugins &&
            window.Capacitor.Plugins.AppInstaller
          ) {
            window.Capacitor.Plugins.AppInstaller.notifyAppReady();
          }
        } catch (e) {}

        function isReactHubReady() {
          return !!window.__studioHubReady;
        }

        var handleReactReady = function () {
          window.removeEventListener('studio-hub-ready', handleReactReady);
          window.removeEventListener('studio:hub-ready', handleReactReady);
          intro.style.transition = 'opacity 80ms ease-out';
          intro.style.opacity = '0';
          setTimeout(function () {
            intro.classList.add('dismissed');
            if (intro.parentNode) intro.parentNode.removeChild(intro);
          }, 100);
        };

        if (isReactHubReady()) {
          handleReactReady();
        } else {
          window.addEventListener('studio-hub-ready', handleReactReady);
          window.addEventListener('studio:hub-ready', handleReactReady);
          setTimeout(handleReactReady, 3000); // safety fallback
        }
      })();

      // ── Web Auto-Updater ────────────────────────────────────────────────
      // On web (non-Capacitor), silently reload if the server has a newer
      // version than what this HTML was built with. This fixes browsers
      // that aggressively cache index.html and serve a stale bundle.
      // The script runs once per page load, is a no-op on native, and
      // uses sessionStorage to prevent infinite reload loops.
      (function () {
        try {
          // Skip on native (Capacitor)
          if (
            window.Capacitor &&
            typeof window.Capacitor.isNativePlatform === 'function' &&
            window.Capacitor.isNativePlatform()
          )
            return;

          // Prevent infinite reload loops — only attempt once per session
          var RELOAD_KEY = 'studio:web-auto-reload-done';
          if (sessionStorage.getItem(RELOAD_KEY)) return;

          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (data) {
              if (!data || !data.version) return;

              // Compare with a script tag attribute that Vite will NOT hash-bust.
              // We use the inline APP_VERSION from the app's JS module. If the
              // app hasn't loaded yet, we can't compare — but that's fine because
              // the module will load the correct version. The issue is when the
              // HTML itself is cached, causing Vite to reference OLD hashed
              // filenames that may return 404. In that case the <script> module
              // tag below will fail, and this fetch succeeds, so we can reload.
              //
              // Simpler approach: just check if the assets this HTML references
              // are actually available on the server. If this HTML is stale, the
              // hashed JS bundles it references won't exist anymore.
              var scripts = document.querySelectorAll('script[src*="/assets/"]');
              if (scripts.length === 0) return; // dev mode, nothing to check

              // Check if the main entry JS asset exists
              var mainScript = scripts[scripts.length - 1];
              var src = mainScript.getAttribute('src');
              if (!src) return;

              fetch(src, { method: 'HEAD', cache: 'no-store' })
                .then(function (r) {
                  if (r.ok) return; // assets exist, HTML is current
                  // Assets are missing — this HTML is stale. Reload.
                  console.log(
                    '[Studio Web Updater] Stale HTML detected, reloading for v' + data.version
                  );
                  sessionStorage.setItem(RELOAD_KEY, '1');
                  window.location.reload();
                })
                .catch(function () {
                  /* network error, don't reload */
                });
            })
            .catch(function () {
              /* swallow */
            });
        } catch (e) {
          /* never block app startup */
        }
      })();
    </script>
