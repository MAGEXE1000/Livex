apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
// Trigger APK rebuild for v3.3.8 release - polishing update dialog UI and install handoff

android {
    namespace "com.chordex.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.chordex.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 40585
        versionName "4.5.85"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Pinned debug signing config so the SHA-1 fingerprint of every
    // build is identical, regardless of which machine/CI runner produced
    // it. Without this, Android falls back to ~/.android/debug.keystore
    // (auto-generated per machine) and the SHA-1 changes on every fresh
    // GitHub Actions runner — which breaks Google Sign-In with
    // DEVELOPER_ERROR (status 10) the moment a different runner picks
    // up the build, because Firebase only accepts the SHA-1 it knows
    // about.
    //
    // The keystore is checked into the repo at app/debug.keystore. It
    // is a DEBUG keystore (Android's well-known default password
    // "android"), so checking it in is safe — its only purpose is
    // identity stability for development builds.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def ksFile = file('release.keystore')
            def ksPwd = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("ANDROID_KEY_ALIAS")
            def ksKeyPwd = System.getenv("ANDROID_KEY_PASSWORD")
 
            def isProdRelease = System.getenv("LIVEX_PRODUCTION_RELEASE") == "true" || System.getenv("STUDIO_PRODUCTION_RELEASE") == "true"
            if (isProdRelease) {
                if (!ksPwd || !ksAlias || !ksKeyPwd) {
                    throw new GradleException("Production release requested (LIVEX_PRODUCTION_RELEASE=true) but signing secrets (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are missing.")
                }
            }
 
            storeFile ksFile
            storePassword ksPwd
            keyAlias ksAlias
            keyPassword ksKeyPwd
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        compose true
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // implementation project(':capacitor-cordova-android-plugins')
    // Explicit dependency to guarantee GoogleSignIn is in the APK.
    // The capacitor-firebase/authentication plugin transitively pulls
    // play-services-auth, but in some build setups the class
    // com.google.android.gms.auth.api.signin.GoogleSignIn fails to
    // resolve at runtime (NoClassDefFoundError) unless declared here.
    implementation "com.google.android.gms:play-services-auth:$playServicesAuthVersion"
    implementation "com.google.firebase:firebase-auth:$firebaseAuthVersion"
    // Required by OtaCheckWorker — the periodic WorkManager job that
    // polls version.json in the background and posts a notification
    // when a new bundle is available, even with the app closed.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "com.google.guava:listenablefuture:1.0"
    // Compile-time stub for com.google.common.util.concurrent.ListenableFuture.
    // The androidx.work Worker base class exposes ListenableFuture in its
    // public API surface, so javac needs the class on the classpath even
    // though our subclass never references it directly. Without this the
    // build fails with "cannot access ListenableFuture". The :1.0 stub is
    // the official Google-recommended fix and is ~1 KB.
    implementation "com.google.guava:guava:33.2.1-android"
    implementation "androidx.security:security-crypto:1.0.0"
    
    // Jetpack Compose & InkFlow transition
    implementation "com.github.felixny:InkFlow:1.0.1"
    implementation "io.github.kyant0:backdrop:2.0.0"
    implementation "androidx.compose.ui:ui:1.6.1"
    implementation "androidx.compose.material3:material3:1.2.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.1"
    implementation "androidx.activity:activity-compose:1.8.2"
    // MediaSessionCompat, PlaybackStateCompat & NotificationCompat.MediaStyle
    implementation "androidx.media:media:1.7.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith("check") && task.name.endsWith("AarMetadata")) {
        task.enabled = false
    }
    if (task.name == 'validateSigningRelease' || task.name == 'packageRelease') {
        task.doFirst {
            def ksFile = file('release.keystore')
            def ksPwd = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("ANDROID_KEY_ALIAS")
            def ksKeyPwd = System.getenv("ANDROID_KEY_PASSWORD")
            def expectedSha256 = System.getenv("EXPECTED_SIGNATURE_SHA256") ?: "900cf259185c81100cda8bb08571fa23552e9789131cf07a8f4056e4d4129206"

            if (!ksFile.exists()) {
                throw new GradleException(
                    "CRITICAL SECURITY FAILURE: release.keystore missing at ${ksFile.absolutePath}.\n" +
                    "Production builds require the official production release keystore. Fallback to debug key is strictly prohibited!"
                )
            }
            if (ksPwd == null || ksPwd.isEmpty() || ksAlias == null || ksAlias.isEmpty() || ksKeyPwd == null || ksKeyPwd.isEmpty()) {
                throw new GradleException(
                    "CRITICAL SECURITY FAILURE: Production signing environment variables (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are missing!"
                )
            }

            try {
                def ks = java.security.KeyStore.getInstance("PKCS12")
                ksFile.withInputStream { is -> ks.load(is, ksPwd.toCharArray()) }
                def cert = ks.getCertificate(ksAlias)
                if (cert == null) {
                    throw new GradleException("CRITICAL SECURITY FAILURE: Keystore alias '${ksAlias}' not found in ${ksFile.absolutePath}")
                }
                def md = java.security.MessageDigest.getInstance("SHA-256")
                def fingerprint = md.digest(cert.getEncoded()).encodeHex().toString().toLowerCase()
                println "=================================================="
                println "PRODUCTION SIGNING KEY FINGERPRINT VERIFICATION:"
                println "  Keystore File: ${ksFile.name}"
                println "  Key Alias:     ${ksAlias}"
                println "  Certificate:   ${cert.getSubjectDN()}"
                println "  SHA-256:       ${fingerprint}"
                println "=================================================="

                if (fingerprint != expectedSha256) {
                    throw new GradleException(
                        "CRITICAL SECURITY FAILURE: Keystore certificate SHA-256 mismatch!\n" +
                        "  Expected Production SHA-256: ${expectedSha256}\n" +
                        "  Found Keystore SHA-256:      ${fingerprint}\n" +
                        "Production release build CANNOT proceed with an unauthorized signing key!"
                    )
                }
            } catch (Exception e) {
                if (e instanceof GradleException) throw e
                throw new GradleException("CRITICAL SECURITY FAILURE: Failed to verify production keystore certificate: ${e.message}", e)
            }
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}
