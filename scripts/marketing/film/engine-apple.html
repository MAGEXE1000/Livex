<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; overflow: hidden; width: 1440px; height: 1080px; }
    canvas { display: block; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="c" width="1440" height="1080"></canvas>
<script>
'use strict';

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const W = 1440, H = 1080;
const DURATION = 20;

// Apple colour palette
const C = {
  black:    '#000000',
  white:    '#F5F5F7',
  gray1:    '#86868B',
  gray2:    '#3A3A3C',
  gray3:    '#1C1C1E',
  red:      '#E63B2E',
  yellow:   '#F4C542',
};

// ─── EASING ───────────────────────────────────────────────────────────────────
const ease = {
  outCubic:   t => 1 - Math.pow(1 - t, 3),
  outQuart:   t => 1 - Math.pow(1 - t, 4),
  outQuint:   t => 1 - Math.pow(1 - t, 5),
  outExpo:    t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inCubic:    t => t * t * t,
  inQuart:    t => t * t * t * t,
  inOutCubic: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2,

  // Dramatic spring: 12% overshoot, visible bounce, settles crisp
  spring: t => {
    const base = ease.outQuint(t);
    return base + 0.12 * Math.sin(t * Math.PI * 3.8) * Math.exp(-t * 6) * (1 - t);
  },
  // Soft spring for scale: 6% overshoot
  softSpring: t => {
    const base = ease.outQuart(t);
    return base + 0.06 * Math.sin(t * Math.PI * 3.0) * Math.exp(-t * 5) * (1 - t);
  },
};

// Clamp t into [start, end] → 0→1 progress
function prog(t, start, end, fn = ease.outCubic) {
  if (t <= start) return 0;
  if (t >= end)   return 1;
  return fn((t - start) / (end - start));
}

// ─── CANVAS UTILITY ───────────────────────────────────────────────────────────
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h,     x, y + h - r,     r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y,         x + r, y,         r);
  ctx.closePath();
}

// ─── PHONE FRAME — Google Pixel 9 (near-bezel-less) ─────────────────────────
// Real Pixel 9 ratio: 71.8 × 152.1 mm  →  0.472
// At scale=1: body 296 × 637, screen 288 × 613 (4px sides, 14px top, 10px chin)
function drawPhone(ctx, cx, cy, scale, screenFn, { alpha = 1, offsetY = 0, scaleY = 1 } = {}) {
  const s  = scale;
  const PW = 296 * s;   // body width
  const PH = 637 * s;   // body height
  const BR = 44 * s;    // body corner radius (very round, like Pixel 9)
  const BL = 4  * s;    // side bezel — near-zero
  const BT = 14 * s;    // top bezel
  const BB = 10 * s;    // chin — very small
  const SR = 38 * s;    // screen corner radius (slightly less than body)
  const SW = PW - BL * 2;        // screen width  = 288s
  const SH = PH - BT - BB;       // screen height = 613s

  ctx.save();
  ctx.translate(cx, cy + offsetY);
  // Vertical scale for phone entrance/exit animation
  if (scaleY !== 1) ctx.scale(1, scaleY);
  ctx.globalAlpha = alpha;

  // ── deep drop shadow ──
  ctx.save();
  ctx.shadowColor   = 'rgba(0,0,0,0.85)';
  ctx.shadowBlur    = 90 * s;
  ctx.shadowOffsetY = 50 * s;
  rr(ctx, -PW/2, -PH/2, PW, PH, BR);
  ctx.fillStyle = '#0A0A0C';
  ctx.fill();
  ctx.restore();

  // ── body gradient (matte Pixel black) ──
  rr(ctx, -PW/2, -PH/2, PW, PH, BR);
  const bg = ctx.createLinearGradient(-PW/2, -PH/2, PW/2, PH/2);
  bg.addColorStop(0,    '#2E2E32');
  bg.addColorStop(0.35, '#1C1C1E');
  bg.addColorStop(1,    '#0E0E10');
  ctx.fillStyle = bg;
  ctx.fill();

  // thin polished edge
  rr(ctx, -PW/2, -PH/2, PW, PH, BR);
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // ── screen area: clip and draw screenshot ──
  ctx.save();
  rr(ctx, -SW/2, -PH/2 + BT, SW, SH, SR);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.clip();

  // The screenshot is drawn in [0, 0, SW, SH] space
  ctx.translate(-SW/2, -PH/2 + BT);
  if (typeof screenFn === 'function') screenFn(ctx, SW, SH);
  ctx.restore();

  // ── screen gloss overlay ──
  const gloss = ctx.createLinearGradient(-SW/2, -PH/2+BT, SW/2, -PH/2+BT + SH*0.25);
  gloss.addColorStop(0, 'rgba(255,255,255,0.06)');
  gloss.addColorStop(1, 'rgba(255,255,255,0)');
  rr(ctx, -SW/2, -PH/2+BT, SW, SH, SR);
  ctx.fillStyle = gloss;
  ctx.fill();

  // ── punch-hole camera — pill shape, centered at top ──
  const camX = 0;
  const camY = -PH/2 + BT * 0.52;
  const camW = 14 * s;
  const camH =  5 * s;
  const camR =  2.5 * s;
  rr(ctx, camX - camW/2, camY - camH/2, camW, camH, camR);
  ctx.fillStyle = '#060608';
  ctx.fill();
  // subtle ring around camera
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // ── side buttons (very flush, modern Pixel 9 style) ──
  ctx.fillStyle = '#222226';
  // Volume Up
  rr(ctx, -PW/2 - 3*s, -PH*0.175, 3.5*s, 28*s, 2*s);
  ctx.fill();
  // Volume Down
  rr(ctx, -PW/2 - 3*s,  PH*0.035,  3.5*s, 28*s, 2*s);
  ctx.fill();
  // Power / Lock (right side)
  rr(ctx,  PW/2 - 0.5*s, -PH*0.095, 3.5*s, 40*s, 2*s);
  ctx.fill();

  ctx.restore();
}

// ─── SCREENSHOT INJECTION (Promise-based) ────────────────────────────────────
let _shots = { hub: null, groovex: null, live: null };
window._screenshotsReady = Promise.resolve();

window.injectScreenshots = function(hubDataUrl, groovexDataUrl, liveDataUrl) {
  const loadImg = (url) => new Promise((resolve) => {
    const img = new Image();
    img.onload  = () => resolve(img);
    img.onerror = () => { console.warn('[engine] Image failed to load'); resolve(null); };
    img.src = url;
  });

  window._screenshotsReady = Promise.all([
    loadImg(hubDataUrl),
    loadImg(groovexDataUrl),
    loadImg(liveDataUrl),
  ]).then(([hub, groovex, live]) => {
    _shots.hub    = hub;
    _shots.groovex = groovex;
    _shots.live   = live;
    console.log('[engine] Screenshots ready:', !!hub, !!groovex, !!live);
  });

  return window._screenshotsReady;
};

// Draw a screenshot into [0, 0, sw, sh] with object-fit: cover semantics
function drawScreenshot(ctx, sw, sh, img) {
  if (img && img.complete && img.naturalWidth > 0) {
    const ir = img.naturalWidth / img.naturalHeight;
    const sr = sw / sh;
    let sx = 0, sy = 0, sW = img.naturalWidth, sH = img.naturalHeight;
    if (ir > sr) {
      sW = img.naturalHeight * sr;
      sx = (img.naturalWidth - sW) / 2;
    } else {
      sH = img.naturalWidth / sr;
      sy = (img.naturalHeight - sH) / 2;
    }
    ctx.drawImage(img, sx, sy, sW, sH, 0, 0, sw, sh);
  } else {
    // Dark placeholder — app chrome feeling
    ctx.fillStyle = '#090A0C';
    ctx.fillRect(0, 0, sw, sh);
    // Status bar stub
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(0, 0, sw, 28);
    // Content stubs
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(sw*0.08, sh*0.22, sw*0.84, 14);
    ctx.fillRect(sw*0.08, sh*0.28, sw*0.60, 10);
    ctx.fillRect(sw*0.08, sh*0.50, sw*0.75, 12);
    ctx.fillRect(sw*0.08, sh*0.56, sw*0.50, 10);
  }
}

// ─── TYPOGRAPHY ───────────────────────────────────────────────────────────────
function drawLabel(ctx, text, x, y, {
  size = 80, weight = 600, color = C.white,
  alpha = 1, drift = 0, align = 'left',
  tracking = -0.02,
} = {}) {
  if (alpha <= 0.005) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px Geist, -apple-system, system-ui`;
  ctx.textAlign = align;
  ctx.letterSpacing = `${tracking * size}px`;
  ctx.fillText(text, x, y + drift);
  ctx.restore();
}

// ─── BACKGROUND ───────────────────────────────────────────────────────────────
function drawBackground(ctx, t) {
  ctx.fillStyle = C.black;
  ctx.fillRect(0, 0, W, H);

  // During feature scenes: very subtle deep vignette
  const va = prog(t, 4.2, 5.8) * (1 - prog(t, 16.5, 17.5));
  if (va > 0.005) {
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.15, W/2, H/2, H*0.9);
    vig.addColorStop(0, 'rgba(4,4,6,0)');
    vig.addColorStop(1, `rgba(0,0,0,${0.5 * va})`);
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }
}

// ─── SCENE LAYOUT ─────────────────────────────────────────────────────────────
//
//  Act 1   0.0 – 4.5s   Brand intro          (centred)
//  Act 2   4.5 – 9.5s   Hub Library          (phone right, text left)
//  Act 3   9.5 – 13.5s  Groovex              (phone right, text left)
//  Act 4  13.5 – 17.5s  Live Mode            (phone right, text left, red)
//  Act 5  17.5 – 20.0s  Outro                (centred resolve)
//
// Text left column  x = 108
// Phone centre      x = W * 0.635
//

// ─── ACT 1: Brand Intro ───────────────────────────────────────────────────────
function drawAct1(ctx, t) {
  // "Livex." — scale + drift from below, large and confident
  const titleP     = prog(t, 0.8, 2.4, ease.outQuint);
  const titleAlpha = titleP * (1 - prog(t, 3.6, 4.4, ease.inQuart));
  const titleDrift = (1 - titleP) * 90;          // 90px travel — very visible
  const titleScale = 0.90 + 0.10 * prog(t, 0.8, 2.4, ease.softSpring);

  if (titleAlpha > 0.005) {
    ctx.save();
    ctx.translate(W/2, H/2 - 52);
    ctx.scale(titleScale, titleScale);
    drawLabel(ctx, 'Livex.', 0, 0, {
      size: 120, weight: 700, color: C.white,
      alpha: titleAlpha, drift: titleDrift, align: 'center',
      tracking: -0.035,
    });
    ctx.restore();
  }

  // Subtitle — staggered, slightly smaller travel
  const subP     = prog(t, 2.2, 3.6, ease.outQuart);
  const subAlpha = subP * (1 - prog(t, 3.6, 4.3, ease.inCubic));
  const subDrift = (1 - subP) * 40;

  drawLabel(ctx, 'Next-gen musician studio.', W/2, H/2 + 62, {
    size: 30, weight: 300, color: C.gray1,
    alpha: subAlpha, drift: subDrift, align: 'center',
    tracking: 0,
  });
}

// ─── PHONE (shared across acts 2–4) ──────────────────────────────────────────
function drawPhoneScene(ctx, t) {
  // Entrance spring — 320px travel + 0.88→1.0 scale, very dramatic
  const entP      = prog(t, 4.5, 6.4, ease.spring);
  const entScale  = 0.88 + 0.12 * prog(t, 4.5, 6.4, ease.softSpring);
  const exitP     = prog(t, 16.8, 17.8, ease.inQuart);
  const phoneAlpha = entP * (1 - exitP);
  const phoneOffY  = (1 - prog(t, 4.5, 6.4, ease.outQuint)) * 320;
  const exitOffY   = exitP * 240;

  // Ambient float — slow sine, natural feel
  const floatY = Math.sin(t * 0.55) * 7;

  if (phoneAlpha <= 0.005) return;

  const phoneScale = 1.35 * entScale;

  // Screen cross-fades
  const showHub    = 1 - prog(t, 9.1, 9.7, ease.outCubic);
  const showGroove = prog(t, 9.1, 9.7, ease.outCubic) * (1 - prog(t, 13.1, 13.7, ease.outCubic));
  const showLive   = prog(t, 13.1, 13.7, ease.outCubic);

  const CX = W * 0.635;
  const CY = H / 2;

  // Draw in three separate pass layers to handle alpha cross-fade correctly.
  // Each drawPhone call is independent — no globalAlpha interference on canvas
  // because each one saves/restores and we pass alpha via the param.
  if (showHub > 0.005) {
    drawPhone(ctx, CX, CY, phoneScale,
      (c, sw, sh) => { drawScreenshot(c, sw, sh, _shots.hub); },
      { alpha: phoneAlpha * showHub, offsetY: phoneOffY + exitOffY + floatY });
  }
  if (showGroove > 0.005) {
    drawPhone(ctx, CX, CY, phoneScale,
      (c, sw, sh) => { drawScreenshot(c, sw, sh, _shots.groovex); },
      { alpha: phoneAlpha * showGroove, offsetY: phoneOffY + exitOffY + floatY });
  }
  if (showLive > 0.005) {
    drawPhone(ctx, CX, CY, phoneScale,
      (c, sw, sh) => { drawScreenshot(c, sw, sh, _shots.live); },
      { alpha: phoneAlpha * showLive, offsetY: phoneOffY + exitOffY + floatY });
  }
}

// ─── FEATURE TAG (small red uppercase above headline) ─────────────────────────
function drawTag(ctx, t) {
  let label = '', alpha = 0, xSlide = 0;

  if (t >= 4.9 && t < 9.5) {
    label  = 'Hub & Library';
    const ip = prog(t, 5.8, 7.0, ease.outQuint);
    alpha  = ip * (1 - prog(t, 8.8, 9.5, ease.inCubic));
    xSlide = (1 - ip) * -40;
  } else if (t >= 9.5 && t < 13.5) {
    label  = 'Groovex';
    const ip = prog(t, 9.8, 11.0, ease.outQuint);
    alpha  = ip * (1 - prog(t, 12.8, 13.4, ease.inCubic));
    xSlide = (1 - ip) * -40;
  } else if (t >= 13.5 && t < 17.5) {
    label  = 'Live Mode';
    const ip = prog(t, 13.8, 15.0, ease.outQuint);
    alpha  = ip * (1 - prog(t, 16.8, 17.4, ease.inCubic));
    xSlide = (1 - ip) * -40;
  }

  if (alpha > 0.005 && label) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle  = C.red;
    ctx.font       = `500 14px Geist, system-ui`;
    ctx.letterSpacing = '0.13em';
    ctx.fillText(label.toUpperCase(), 108 + xSlide, H/2 - 114);
    ctx.restore();
  }
}

// ─── HEADLINE TEXT (Acts 2–4) ─────────────────────────────────────────────────
function drawHeadlines(ctx, t) {
  // Act 2 — "Everything / you need."
  {
    const ip   = prog(t, 5.6, 7.0, ease.outQuint);
    const op   = prog(t, 8.8, 9.5, ease.inCubic);
    const a    = ip * (1 - op);
    const d1   = (1 - ip) * 100;            // 100px travel — unmissable
    if (a > 0.005) {
      drawLabel(ctx, 'Everything', 108, H/2 - 42, {
        size: 92, weight: 700, color: C.white,
        alpha: a, drift: d1, tracking: -0.033,
      });
    }
    // Line 2 staggered 0.18s
    const ip2 = prog(t, 5.78, 7.2, ease.outQuint);
    const d2  = (1 - ip2) * 100;
    const a2  = ip2 * (1 - op);
    if (a2 > 0.005) {
      drawLabel(ctx, 'you need.', 108, H/2 + 66, {
        size: 92, weight: 700, color: C.gray1,
        alpha: a2, drift: d2, tracking: -0.033,
      });
    }
  }

  // Act 3 — "Practice / perfectly."
  {
    const ip   = prog(t, 9.7, 11.1, ease.outQuint);
    const op   = prog(t, 12.8, 13.5, ease.inCubic);
    const a    = ip * (1 - op);
    const d1   = (1 - ip) * 100;
    if (a > 0.005) {
      drawLabel(ctx, 'Practice', 108, H/2 - 42, {
        size: 92, weight: 700, color: C.white,
        alpha: a, drift: d1, tracking: -0.033,
      });
    }
    const ip2 = prog(t, 9.88, 11.3, ease.outQuint);
    const d2  = (1 - ip2) * 100;
    const a2  = ip2 * (1 - op);
    if (a2 > 0.005) {
      drawLabel(ctx, 'perfectly.', 108, H/2 + 66, {
        size: 92, weight: 700, color: C.gray1,
        alpha: a2, drift: d2, tracking: -0.033,
      });
    }
  }

  // Act 4 — "Perform / live."  (second word in Livex red)
  {
    const ip   = prog(t, 13.7, 15.1, ease.outQuint);
    const op   = prog(t, 16.8, 17.5, ease.inCubic);
    const a    = ip * (1 - op);
    const d1   = (1 - ip) * 100;
    if (a > 0.005) {
      drawLabel(ctx, 'Perform', 108, H/2 - 42, {
        size: 92, weight: 700, color: C.white,
        alpha: a, drift: d1, tracking: -0.033,
      });
    }
    const ip2 = prog(t, 13.88, 15.3, ease.outQuint);
    const d2  = (1 - ip2) * 100;
    const a2  = ip2 * (1 - op);
    if (a2 > 0.005) {
      drawLabel(ctx, 'live.', 108, H/2 + 66, {
        size: 92, weight: 700, color: C.red,
        alpha: a2, drift: d2, tracking: -0.033,
      });
    }
  }
}

// ─── VERTICAL DIVIDER (features section) ─────────────────────────────────────
function drawDivider(ctx, t) {
  const a = prog(t, 5.0, 6.2, ease.outCubic) * (1 - prog(t, 16.8, 17.6, ease.inCubic));
  if (a <= 0.005) return;
  ctx.save();
  ctx.globalAlpha = a * 0.15;
  ctx.strokeStyle = C.white;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W * 0.045, H / 2 - 150);
  ctx.lineTo(W * 0.045, H / 2 + 150);
  ctx.stroke();
  ctx.restore();
}

// ─── ACT 5: Outro ─────────────────────────────────────────────────────────────
function drawAct5(ctx, t) {
  // "Livex." reappears centred — drifts up from below, scale from 0.92
  const ip       = prog(t, 17.8, 19.2, ease.outQuint);
  const outroA   = ip * (1 - prog(t, 19.5, 20.0, ease.inCubic));
  const outroDrift = (1 - ip) * 70;
  const outroScale = 0.92 + 0.08 * prog(t, 17.8, 19.2, ease.softSpring);

  if (outroA > 0.005) {
    ctx.save();
    ctx.translate(W/2, H/2 - 36);
    ctx.scale(outroScale, outroScale);
    drawLabel(ctx, 'Livex.', 0, 0, {
      size: 90, weight: 700, color: C.white,
      alpha: outroA, drift: outroDrift, align: 'center',
      tracking: -0.035,
    });
    ctx.restore();
  }

  // "livex.app" — slides in from slightly left
  const tagP  = prog(t, 18.7, 19.5, ease.outCubic);
  const tagA  = tagP * (1 - prog(t, 19.5, 20.0, ease.inCubic));
  const tagX  = (1 - tagP) * -30;
  if (tagA > 0.005) {
    ctx.save();
    ctx.globalAlpha = tagA;
    ctx.fillStyle  = C.gray1;
    ctx.font       = `400 24px Geist, system-ui`;
    ctx.textAlign  = 'center';
    ctx.letterSpacing = '0.04em';
    ctx.fillText('livex.app', W/2 + tagX, H/2 + 50);
    ctx.restore();
  }
}

// ─── MAIN seek() ──────────────────────────────────────────────────────────────
window.seek = function(t) {
  t = Math.max(0, Math.min(DURATION, t));
  const ctx = document.getElementById('c').getContext('2d');

  drawBackground(ctx, t);
  drawAct1(ctx, t);
  drawPhoneScene(ctx, t);
  drawDivider(ctx, t);
  drawTag(ctx, t);
  drawHeadlines(ctx, t);
  drawAct5(ctx, t);
};

// ─── MOTION BLUR ACCUMULATOR ──────────────────────────────────────────────────
let _blurCanvas = null;

window.renderBlurredFrame = function(frameIndex, fps, duration) {
  const SUBS = 4;
  const dt   = 1 / fps;
  const t0   = frameIndex / fps;

  if (!_blurCanvas) {
    _blurCanvas = document.createElement('canvas');
    _blurCanvas.width  = W;
    _blurCanvas.height = H;
  }
  const bc  = _blurCanvas.getContext('2d');
  const src = document.getElementById('c');

  bc.clearRect(0, 0, W, H);
  for (let s = 0; s < SUBS; s++) {
    const st = Math.min(duration, t0 + (s / SUBS) * dt);
    window.seek(st);
    bc.globalAlpha = 1 / SUBS;
    bc.drawImage(src, 0, 0);
  }

  return _blurCanvas.toDataURL('image/jpeg', 0.94);
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.initEngine = function() {
  const ctx = document.getElementById('c').getContext('2d');
  // Pre-warm fonts so first rendered frame has no FOIT flash
  ctx.font = '700 120px Geist, system-ui';
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillText('Livex.', 0, -100);
  ctx.font = '300 30px Geist, system-ui';
  ctx.fillText('Next-gen musician studio.', 0, -100);
  ctx.font = '500 14px Geist, system-ui';
  ctx.fillText('HUB & LIBRARY', 0, -100);
  return true;
};

window.getDuration = () => DURATION;
</script>
</body>
</html>
