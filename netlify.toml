[build]
  command = "pnpm build:web"
  publish = "dist/web"
  ignore = "node scripts/netlify-ignore.mjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self), midi=(self), autoplay=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://apis.google.com https://www.gstatic.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://studio-30f44.web.app https://*.firebasestorage.app https://firebasestorage.googleapis.com https://storage.googleapis.com https://lh3.googleusercontent.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://studio-30f44.firebaseapp.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://*.firestore.googleapis.com wss://*.firestore.googleapis.com https://firebasestorage.googleapis.com https://*.firebasestorage.app https://storage.googleapis.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://apis.google.com https://accounts.google.com https://pub-b6a593f7d45247389f1accd1a54fec5c.r2.dev https://oramics.github.io https://raw.githubusercontent.com https://tonejs.github.io https://lrclib.net https://app.tolgee.io https://api.github.com https://github.com https://studio-30f44.web.app; media-src 'self' blob: data: https://pub-b6a593f7d45247389f1accd1a54fec5c.r2.dev https://oramics.github.io https://raw.githubusercontent.com https://tonejs.github.io https://*.firebasestorage.app https://firebasestorage.googleapis.com; frame-src 'self' https://studio-30f44.firebaseapp.com https://*.firebaseapp.com https://apis.google.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://accounts.google.com; upgrade-insecure-requests;"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/sw-push.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/version.json"
  to = "https://studio-30f44.web.app/version.json"
  status = 200
  force = true

[[redirects]]
  from = "/app-release.json"
  to = "https://studio-30f44.web.app/app-release.json"
  status = 200
  force = true

[[redirects]]
  from = "/apk/*"
  to = "https://studio-30f44.web.app/apk/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200



